<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سیستەمێ جوداکرنا داتایێن هاوبەشێ کارەبێ</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --primary: #1a5276;
      --secondary: #2e86c1;
      --success: #27ae60;
      --danger: #c0392b;
      --bg: #f4f7f6;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 20px;
      color: #2c3e50;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 95vh;
    }
    .card {
      width: 100%;
      max-width: 720px;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      border-top: 6px solid var(--primary);
    }
    .header {
      text-align: center;
      border-bottom: 2px solid #edf2f7;
      padding-bottom: 20px;
      margin-bottom: 25px;
    }
    .header h2 {
      margin: 0 0 8px 0;
      color: var(--primary);
      font-size: 22px;
    }
    .header .subtitle {
      font-size: 13px;
      color: #7f8c8d;
      font-weight: 500;
    }
    .security-badge {
      display: inline-block;
      background: #e8f8f5;
      color: #117a65;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 10px;
      border: 1px solid #a3e4d7;
    }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px; }
    input[type="file"], textarea, select, input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 14px;
      background: #fff;
    }
    textarea { height: 105px; resize: vertical; }
    .mapping-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 18px;
      border-radius: 8px;
      margin-bottom: 18px;
      display: none;
    }
    .col-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }
    .col-row select { flex: 1.2; }
    .col-row input { flex: 1.2; }
    .btn-remove {
      background: #fbeae8;
      color: var(--danger);
      border: 1px solid #fadbd8;
      border-radius: 6px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }
    .btn-add {
      background: #ebf5fb;
      color: var(--secondary);
      border: 1px dashed var(--secondary);
      border-radius: 6px;
      padding: 9px;
      width: 100%;
      cursor: pointer;
      font-weight: bold;
      margin-top: 6px;
    }
    button.btn-main {
      background-color: var(--success);
      color: white;
      border: none;
      padding: 13px;
      font-size: 16px;
      border-radius: 7px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
      transition: background 0.2s;
    }
    button.btn-main:hover { background-color: #219150; }
    #status {
      margin-top: 15px;
      font-size: 13px;
      padding: 12px;
      border-radius: 7px;
      display: none;
      line-height: 1.5;
    }
    .info { background: #ebf5fb; color: #1b4f72; border: 1px solid #aed6f1; }
    .success { background: #eafaf1; color: #145a32; border: 1px solid #a9dfbf; }
    .error { background: #fdedec; color: #78281f; border: 1px solid #f5b7b1; }
    .footer {
      margin-top: auto;
      padding-top: 25px;
      text-align: center;
      font-size: 12px;
      color: #64748b;
      line-height: 1.6;
    }
    .author-name {
      font-weight: bold;
      color: var(--primary);
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h2>سیستەمێ دیاریکرن و جوداکرنا داتایێن هاوبەشان</h2>
    <div class="subtitle">ئامرازەکێ فەرمی بۆ ب ساناهیکرنا دەرئینانا هەژمارێن پیڤەرێ وان هاتی گرێدان</div>
    <div class="security-badge">🔒 پاراستنا داتایان: داتا ب تەمامی د کۆمپیۆتەرێ تە دا دهێنە خواندن و بۆ چ جهێن دەرەکی ناچن</div>
  </div>

  <div class="form-group">
    <label>١. فایلا سەرەکی یا ئێکسلێ (فایلا مەزن) هەلبژێره:</label>
    <input type="file" id="mainFile" accept=".xlsx, .xls" onchange="loadFileColumns()" />
  </div>

  <div id="mappingBox" class="mapping-box">
    <div class="form-group" style="border-bottom: 1px solid #e2e8f0; padding-bottom: 14px;">
      <label style="color: var(--primary);">٢. تە دڤێت ل دویڤ کیژ ستوینێ بگەڕی؟ (نموونە: هەژماری هەژمار یان هەر ستوینەک):</label>
      <select id="lookupColumn"></select>
    </div>

    <div class="form-group">
      <label style="color: var(--primary);">٣. ستوینێن د فایلا نوى دا دەردکەڤن (ستوینێ هەلبژێره و ناڤێ وێ ب کەیفا خوە د تێکست بۆکسێ دا بنڤێسە):</label>
      <div id="columnsContainer"></div>
      <button type="button" class="btn-add" onclick="addNewColumnRow()">+ زێدەکرنا ستوینەکا دی</button>
    </div>
  </div>

  <div class="form-group">
    <label>٤. وان داتایێن تە دڤێن بگەڕییێ ل ڤێرە بنڤێسە یان کۆپی بکە (هەر رێزەکێ دانەیەک):</label>
    <textarea id="targetList" placeholder="هەژماری هەژمار ل ڤێرێ بنڤیسە یان کۆپی بکە
.....7000
.....7000
.....7000
.....7000"></textarea>
  </div>

  <button class="btn-main" onclick="processData()">دەستپێکرنا جوداکرنێ و دابەزاندنا فایلا نوى</button>

  <div id="status"></div>
</div>

<div class="footer">
  ئامادەکرن ژ لایێ: <span class="author-name">Mohammed Khudhir Jameel</span><br>
  وەشان 1.0 (2026)
</div>

<script>
let globalRows = [];
let availableHeaders = [];

function showStatus(text, type) {
  const status = document.getElementById('status');
  status.textContent = text;
  status.className = type;
  status.style.display = 'block';
}

function loadFileColumns() {
  const fileInput = document.getElementById('mainFile');
  if (!fileInput.files.length) return;

  showStatus('چاڤەڕێ بە، ستوینێن فایلێ د هێنە خواندن...', 'info');

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      globalRows = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });

      if (globalRows.length === 0) {
        showStatus('فایل ڤالایە یان چو زانیاری تێدا نینن.', 'error');
        return;
      }

      availableHeaders = Object.keys(globalRows[0]);
      
      const lookupSelect = document.getElementById('lookupColumn');
      lookupSelect.innerHTML = '<option value="">-- ستوینا لێگەڕیانێ هەلبژێره --</option>';
      availableHeaders.forEach(h => {
        const opt = document.createElement('option');
        opt.value = h;
        opt.textContent = h;
        lookupSelect.appendChild(opt);
      });

      const defaultLookup = availableHeaders.find(h => {
        const l = h.toLowerCase();
        return l.includes('account') || l.includes('هەژمار') || l.includes('phone') || l.includes('مۆبایل') || l.includes('موبايل');
      });
      if (defaultLookup) lookupSelect.value = defaultLookup;

      setupDefaultExportColumns();

      document.getElementById('mappingBox').style.display = 'block';
      showStatus(`فایل هاتە ڤەکرن (${globalRows.length} تۆمار تێدانە). نها دشێی ب کەیفا خوە ستوینان دیار بکەی.`, 'success');
    } catch (err) {
      showStatus('شاشیەک چێبوو دەمێ خواندنا فایلێ: ' + err.message, 'error');
    }
  };
  reader.readAsArrayBuffer(fileInput.files[0]);
}

function setupDefaultExportColumns() {
  const container = document.getElementById('columnsContainer');
  container.innerHTML = '';

  // دروستکرنا رێزێن سەرەتایی ب تێکست بۆکسێن ڤالا
  addNewColumnRow('account');
  addNewColumnRow('meter');
  addNewColumnRow('date');
  addNewColumnRow('comment');
}

function addNewColumnRow(autoMatchWord = '') {
  const container = document.getElementById('columnsContainer');
  const div = document.createElement('div');
  div.className = 'col-row';

  const select = document.createElement('select');
  select.className = 'export-col-select';
  select.innerHTML = '<option value="">-- ستوینەکێ ژ فایلێ هەلبژێره --</option>';
  
  availableHeaders.forEach(h => {
    const opt = document.createElement('option');
    opt.value = h;
    opt.textContent = h;
    select.appendChild(opt);
  });

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'export-col-name';
  input.placeholder = 'ناڤێ ستوینێ د فایلا نوی دا بنڤیسە';
  input.value = ''; // هەمی تێکست بۆکس ب تەمامی ڤالانە

  if (autoMatchWord) {
    const matched = availableHeaders.find(h => h.toLowerCase().includes(autoMatchWord.toLowerCase()));
    if (matched) {
      select.value = matched;
    }
  }

  const removeBtn = document.createElement('button');
  removeBtn.type = 'button';
  removeBtn.className = 'btn-remove';
  removeBtn.textContent = '✕';
  removeBtn.onclick = function() {
    container.removeChild(div);
  };

  div.appendChild(select);
  div.appendChild(input);
  div.appendChild(removeBtn);
  container.appendChild(div);
}

function processData() {
  if (globalRows.length === 0) {
    showStatus('هیڤیە بەری هەر تشتەکی فایلا ئێکسلێ هەلبژێره.', 'error');
    return;
  }

  const lookupCol = document.getElementById('lookupColumn').value;
  const targetText = document.getElementById('targetList').value.trim();

  if (!lookupCol) {
    showStatus('هیڤیە ستوینا لێگەڕیانێ دیار بکە.', 'error');
    return;
  }
  if (!targetText) {
    showStatus('هیڤیە داتایێن تە دڤێن بگەڕییێ د چوارچووڤەی دا بنڤێسە.', 'error');
    return;
  }

  const rowsSelectors = document.querySelectorAll('.col-row');
  const exportConfigs = [];

  rowsSelectors.forEach(row => {
    const colSource = row.querySelector('.export-col-select').value;
    const colLabel = row.querySelector('.export-col-name').value.trim();
    if (colSource) {
      exportConfigs.push({
        source: colSource,
        // ئەگەر ناڤەک نەهاتبیتە نڤیسین، ناڤێ ستوینا ئەسلی بکاردهینیت
        label: colLabel || colSource
      });
    }
  });

  if (exportConfigs.length === 0) {
    showStatus('هیڤیە کێمتی کێم ستوینەکێ دەستنیشان بکە دا کو د فایلا نوى دا دەربکەڤیت.', 'error');
    return;
  }

  const targetSet = new Set(
    targetText.split('\n').map(t => t.trim()).filter(Boolean)
  );

  const filtered = [];
  for (const row of globalRows) {
    const currentVal = String(row[lookupCol] ?? '').trim();

    if (targetSet.has(currentVal)) {
      const newRowObject = {};
      exportConfigs.forEach(cfg => {
        newRowObject[cfg.label] = row[cfg.source] !== undefined ? String(row[cfg.source]).trim() : '';
      });
      filtered.push(newRowObject);
    }
  }

  if (filtered.length === 0) {
    showStatus('چو داتا ل دویڤ وان داتایێن تە د ناڤ وێ ستوینێ دا نەهاتنە دیتن.', 'error');
    return;
  }

  const newWs = XLSX.utils.json_to_sheet(filtered);
  const newWb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(newWb, newWs, "داتایێن_جوداکری");
  XLSX.writeFile(newWb, "Filtered_Subscribers.xlsx");

  showStatus(`سەرکەفتن! داتایێن (${filtered.length}) هاوبەشان ب سەرکەفتیانە هاتنە جوداکرن و فایل هاتە داونلۆدکرن.`, 'success');
}
</script>

</body>
</html>
